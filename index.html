<style>
/* Layout: fixed console rail on the left, working pane on the right; rail becomes a top tab strip on phones. Single dark look on purpose (SOC consoles run dark). */
:root{
  --bg:#0e141c; --panel:#151d28; --panel2:#1b2533; --line:#273345; --fg:#dbe3ee; --muted:#8796ab;
  --accent:#f0a64a; --accent-ink:#1a1206; --link:#7cb6ff;
  --crit:#ff5d6c; --high:#ff8a4c; --med:#f2c94c; --low:#5fc7a3; --info:#7c8ea8;
  --tp:#ff7a7a; --fp:#6fd3a9;
  --f-display:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
html{height:100%}body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding-block:16px;padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:12px;gap:4px;overflow-y:auto;position:sticky;top:0;align-self:start;max-height:100vh;z-index:5}
.brand{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.04em;padding:4px 10px 14px;display:flex;align-items:center;gap:8px}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.nav{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;color:var(--muted);font-weight:500}
.nav:hover{background:var(--panel2);color:var(--fg)}
.nav[aria-current="true"]{background:var(--panel2);color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.nav .cnt{font-family:var(--f-mono);font-size:12px;background:var(--crit);color:#fff;border-radius:10px;padding:0 7px}
.rail hr{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.rail .spacer{flex:1}
main{padding-block:20px 40px;padding-right:max(20px, env(safe-area-inset-right, 0px));padding-left:20px;min-width:0}
.topbar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.topbar h1{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
.topbar p{margin:2px 0 0;color:var(--muted)}
.clock{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock .time{font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums;background:var(--bg);border:1px solid var(--line);padding:4px 10px;border-radius:6px}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel2);padding:6px 12px;border-radius:6px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:transparent;padding:5px 10px;cursor:pointer;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.grid{display:grid;gap:16px}
.tiles{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.card h2,.card h3{font-family:var(--f-display);margin:0 0 10px;font-size:16px;font-weight:600;text-wrap:balance}
.tile .lab{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.tile .val{font-family:var(--f-display);font-size:32px;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.two{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.legend{display:grid;gap:6px;font-size:13px}
.legend span{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:8px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;color:var(--muted);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--line);padding:8px}
td{border-bottom:1px solid var(--line);padding:8px;vertical-align:top}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--panel2)}
.mono{font-family:var(--f-mono);font-size:12.5px;font-variant-numeric:tabular-nums}
.sev{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
.sev::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.sev.Critical{color:var(--crit)}.sev.High{color:var(--high)}.sev.Medium{color:var(--med)}.sev.Low{color:var(--low)}
.pill{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.open{color:var(--accent);border-color:var(--accent)}
.pill.owned{color:var(--link);border-color:var(--link)}
.pill.tp{color:var(--tp);border-color:var(--tp)}
.pill.fp{color:var(--fp);border-color:var(--fp)}
.pill.good{color:var(--fp);border-color:var(--fp)}
.pill.bad{color:var(--crit);border-color:var(--crit)}
.muted{color:var(--muted)}
.kv{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-family:var(--f-mono);font-size:12.5px;word-break:break-all}
.chip{cursor:pointer;border:1px dashed var(--line);background:transparent;border-radius:4px;padding:0 5px;font-family:var(--f-mono);font-size:12px;color:var(--link)}
.chip:hover{border-color:var(--link)}
.q{display:flex;gap:8px;flex-wrap:wrap}
.q input{flex:1;min-width:200px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-family:var(--f-mono);font-size:13px}
.hint{font-size:12.5px;color:var(--muted)}
pre.raw{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;word-break:break-all;margin:6px 0 0}
.verdict{border-radius:8px;padding:14px;border:1px solid var(--line);background:var(--panel2)}
.verdict.bad{border-color:var(--crit)}
.verdict.good{border-color:var(--fp)}
.verdict.unk{border-color:var(--muted)}
.prose{max-width:72ch}
.prose h3{margin-top:18px}
.prose li{margin-bottom:6px}
.prose code{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);padding:1px 5px;border-radius:4px}
details.pb{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
details.pb summary{cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px}
details.pb ol{margin:10px 0 0;padding-left:20px}
details.pb li{margin-bottom:6px}
/* drawer */
.scrim{position:fixed;inset:0;background:rgba(5,8,12,.6);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:21;overflow-y:auto;padding-block:calc(18px + env(safe-area-inset-top,0px)) calc(30px + env(safe-area-inset-bottom,0px));padding-left:20px;padding-right:max(20px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:16px}
.drawer h2{font-family:var(--f-display);margin:0;font-size:19px;text-wrap:balance}
.form{display:grid;gap:12px}
.form label.t{font-weight:600;font-size:13px}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
.radios input:checked + span{color:var(--accent);font-weight:600}
textarea,.form input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font-size:13px}
textarea{min-height:110px;resize:vertical}
.err{color:var(--crit);font-size:12.5px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);padding:8px 16px;border-radius:6px;font-weight:600;z-index:30}
.bar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.recipe{display:grid;gap:8px}
.recipe .row{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.recipe pre.raw{margin:0;flex:1;min-width:220px;color:var(--fg)}
.recipe .room{font-family:var(--f-mono);font-size:12px;color:var(--muted);word-break:break-all}
.recipe ul{margin:0;padding-left:18px}
.recipe li{margin-bottom:4px}
.anat{display:grid;grid-template-columns:minmax(0,max-content) 1fr;gap:8px 14px;align-items:start}
.anat code{font-family:var(--f-mono);font-size:12.5px;background:var(--bg);padding:2px 6px;border-radius:4px;color:var(--accent);word-break:break-all}
.qerr{border:1px solid var(--crit);border-radius:6px;padding:8px 10px;color:var(--crit);font-size:13px;margin:8px 0}
td.num{text-align:right}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding-block:8px;padding-right:max(12px, env(safe-area-inset-right, 0px))}
  .brand{padding:4px 8px;font-size:15px;white-space:nowrap}
  .rail hr,.rail .spacer{display:none}
  .nav{white-space:nowrap;gap:6px}
  main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
}
@media (prefers-reduced-motion:no-preference){.new-row td{animation:flash 1.6s ease-out}@keyframes flash{from{background:rgba(240,166,74,.25)}to{background:transparent}}}
</style>

</div>

// ---- SIEM query engine: a working slice of Splunk SPL.
// Search part: field=value, != > < >= <=, field IN (a, b), * wildcards, quoted values, bare words (full text),
// implicit AND, OR (binds tighter than AND, as in Splunk), NOT. index=main is accepted (one index here).
// Pipes: stats, timechart, table, sort, reverse, head, tail, dedup, top.
const PIPE_CMDS=["stats","timechart","table","sort","reverse","head","tail","dedup","top"];
const escA = s => esc(s).replace(/'/g,"&#39;");
function splitPipes(q){ const out=[]; let cur="",inq=false; for(const ch of q){ if(ch==='"')inq=!inq; if(ch==="|"&&!inq){out.push(cur);cur="";} else cur+=ch; } out.push(cur); return out.map(x=>x.trim()); }
const unq = x => x.replace(/^"(.*)"$/,"$1");
function parseSearch(q){
  const re=/(\w+)\s+IN\s*\(([^)]*)\)|(\w+)\s*(!=|>=|<=|=|>|<)\s*("([^"]*)"|[^\s()]+)|"([^"]*)"|([^\s()]+)/gi;
  const groups=[]; let m, joinNext=false, neg=false;
  while((m=re.exec(q))){
    let term;
    if(m[1]) term={f:m[1],op:"in",vals:m[2].split(",").map(x=>unq(x.trim()).replace(/\\\//g,"/")).filter(Boolean)};
    else if(m[3]) term={f:m[3],op:m[4],v:(m[6]!==undefined?m[6]:m[5]).replace(/\\\//g,"/")};
    else {
      const quoted=m[7]!==undefined, w=quoted?m[7]:m[8], W=w.toUpperCase();
      if(!quoted&&W==="AND") continue;
      if(!quoted&&W==="OR"){ joinNext=true; continue; }
      if(!quoted&&W==="NOT"){ neg=true; continue; }
      term={text:w.replace(/\\\//g,"/")};
    }
    if(term.f==="index"){ neg=false; joinNext=false; continue; }
    term.neg=neg; neg=false;
    if(joinNext&&groups.length) groups[groups.length-1].push(term); else groups.push([term]);
    joinNext=false;
  }
  return groups;
}
const wild = v => new RegExp("^"+v.split("*").map(x=>x.replace(/[.+?^${}()|[\]\\]/g,"\\$&")).join(".*")+"$","i");
const fv = (l,f) => f==="_time"?fmt(l.t):l[f];
function matchTerm(l,t){
  let hit;
  if(t.text!==undefined) hit = t.text==="*" || JSON.stringify(l).toLowerCase().includes(t.text.toLowerCase().replace(/\\/g,"\\\\"));
  else {
    const val=fv(l,t.f);
    if(t.op==="in") hit = val!==undefined && t.vals.some(v=>wild(v).test(String(val)));
    else if(t.op==="=") hit = val!==undefined && wild(t.v).test(String(val));
    else if(t.op==="!=") hit = val!==undefined && !wild(t.v).test(String(val)); // like Splunk: != needs the field to exist
    else { const a=parseFloat(val), b=parseFloat(t.v); hit = !isNaN(a)&&!isNaN(b)&&({">":a>b,"<":a<b,">=":a>=b,"<=":a<=b})[t.op]; }
  }
  return t.neg?!hit:hit;
}
function parseAggs(txt){
  const re=/\b(count|sum|avg|min|max|dc|values)\b(?:\(([^)]*)\))?(?:\s+as\s+(\w+))?/gi; const out=[]; let m;
  while((m=re.exec(txt||""))){ const fn=m[1].toLowerCase(), f=(m[2]||"").trim(); out.push({fn,f,name:m[3]||(f?`${fn}(${f})`:fn)}); }
  return out;
}
function aggregate(a,rows,get){
  const vals=a.f?rows.map(r=>get(r,a.f)).filter(v=>v!==undefined&&v!==""):rows;
  if(a.fn==="count") return vals.length;
  if(a.fn==="dc") return new Set(vals.map(String)).size;
  if(a.fn==="values") return [...new Set(vals.map(String))].sort().join(", ");
  const nums=vals.map(Number).filter(Number.isFinite); if(!nums.length) return "";
  if(a.fn==="sum") return nums.reduce((x,y)=>x+y,0);
  if(a.fn==="avg") return Math.round(nums.reduce((x,y)=>x+y,0)/nums.length*100)/100;
  if(a.fn==="min") return Math.min(...nums);
  if(a.fn==="max") return Math.max(...nums);
}

function cmpVals(a,b){
  if(a===undefined||a==="") return 1; if(b===undefined||b==="") return -1;

  const T=(rows,cols,calc)=>({mode:"table",rows,cols,calc:new Set(calc||[]),matched:res.matched});
  if(cmd==="table"){
    const cols=fieldList(arg); if(!cols.length) throw new Error("table needs field names, for example | table _time, host, Image");
    return T(res.rows.map(r=>Object.fromEntries(cols.map(c=>[c,get(r,c)]))),cols,["_time"]);
  }
  if(cmd==="stats"){
    const [aggTxt,byTxt]=arg.split(/\s+by\s+/i); const aggs=parseAggs(aggTxt);
    if(!aggs.length) throw new Error("stats needs a function: count, sum(field), avg(field), min, max, dc(field) or values(field). Example: | stats count by host");
    const by=byTxt?fieldList(byTxt):[]; const buckets=new Map();
    if(!by.length) buckets.set("all",{keys:[],rows:res.rows});
    else res.rows.forEach(r=>{ const keys=by.map(f=>get(r,f)); if(keys.some(v=>v===undefined)) return; const k=JSON.stringify(keys); if(!buckets.has(k)) buckets.set(k,{keys,rows:[]}); buckets.get(k).rows.push(r); });
    const rows=[...buckets.values()].map(b=>{ const o={}; by.forEach((f,i)=>o[f]=b.keys[i]); aggs.forEach(a=>o[a.name]=aggregate(a,b.rows,get)); return o; });
    rows.sort((x,y)=>{ for(const f of by){ const c=cmpVals(x[f],y[f]); if(c) return c; } return 0; });
    return T(rows,[...by,...aggs.map(a=>a.name)],aggs.map(a=>a.name));
  }
  if(cmd==="timechart"){
    if(res.mode!=="events") throw new Error("timechart has to come straight after the search, before stats or table.");
    const sm=arg.match(/span\s*=\s*(\d+)\s*(s|m|h|d)/i); const span=sm?(+sm[1])*({s:1,m:60,h:3600,d:86400}[sm[2].toLowerCase()]):60;
    const aggs=parseAggs(arg.replace(/span\s*=\s*\S+/i,"")); if(!aggs.length) aggs.push({fn:"count",f:"",name:"count"});
    const b0=BASE.getTime()/1000, bucket=t=>Math.floor((b0+t)/span)*span;
    const groups=new Map(); res.rows.forEach(l=>{ const k=bucket(l.t); if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(l); });
    const keys=[...groups.keys()]; const rows=[];
    if(keys.length){ for(let k=Math.min(...keys);k<=Math.max(...keys);k+=span){ const d=new Date(k*1000);
      const label=span>=86400?`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`:d.toTimeString().slice(0,span<60?8:5);
      const o={_time:label}; aggs.forEach(a=>o[a.name]=aggregate(a,groups.get(k)||[],fv)); rows.push(o); } }
    return Object.assign(T(rows,["_time",...aggs.map(a=>a.name)],["_time",...aggs.map(a=>a.name)]),{chart:true});
  }
  if(cmd==="sort"){
    let toks=fieldList(arg.replace(/^by\s+/i,"")).filter(x=>x.toLowerCase()!=="by"); let limit=Infinity;
    if(toks.length&&/^\d+$/.test(toks[0])){ limit=+toks[0]; toks=toks.slice(1); }
    if(!toks.length) throw new Error("sort needs a field. Use | sort -count for biggest first, | sort count for smallest first.");
    const keys=toks.map(x=>({f:x.replace(/^[-+]/,""),dir:x.startsWith("-")?-1:1}));
    const rows=res.rows.slice().sort((x,y)=>{ for(const k of keys){ const a=get(x,k.f), b=get(y,k.f); if(a===undefined&&b===undefined) continue; if(a===undefined) return 1; if(b===undefined) return -1; const c=cmpVals(a,b)*k.dir; if(c) return c; } return 0; });
    return {...res,rows:rows.slice(0,limit)};
  }
  if(cmd==="reverse") return {...res,rows:res.rows.slice().reverse()};
  if(cmd==="head"||cmd==="tail"){ const n=parseInt(arg.replace(/limit\s*=\s*/i,""))||10; return {...res,rows:cmd==="head"?res.rows.slice(0,n):res.rows.slice(-n)}; }
  if(cmd==="dedup"){ const fs=fieldList(arg); if(!fs.length) throw new Error("dedup needs a field, for example | dedup DestinationIp"); const seen=new Set(); return {...res,rows:res.rows.filter(r=>{ const k=JSON.stringify(fs.map(f=>get(r,f))); if(seen.has(k)) return false; seen.add(k); return true; })}; }
  if(cmd==="top"){
    const lm=arg.match(/limit\s*=\s*(\d+)/i); const n=lm?+lm[1]:10; const fs=fieldList(arg.replace(/limit\s*=\s*\d+/i,""));
    if(!fs.length) throw new Error("top needs a field, for example | top limit=5 Image");
    const counts=new Map(); let total=0;
    res.rows.forEach(r=>{ const keys=fs.map(f=>get(r,f)); if(keys.some(v=>v===undefined)) return; total++; const k=JSON.stringify(keys); counts.set(k,(counts.get(k)||0)+1); });
    const rows=[...counts.entries()].map(([k,c])=>{ const keys=JSON.parse(k); const o={}; fs.forEach((f,i)=>o[f]=keys[i]); o.count=c; o.percent=Math.round(c/total*10000)/100; return o; }).sort((x,y)=>y.count-x.count).slice(0,n);
    return T(rows,[...fs,"count","percent"],["count","percent"]);

}
function runQ(q){
  const [head,...pipes]=splitPipes(q);
  const groups=parseSearch(head||"*");
  const rows=LOGS.filter(l=>l.t<=S.t).filter(l=>groups.every(g=>g.some(t=>matchTerm(l,t))));
  let res={mode:"events",rows,matched:rows.length};
  pipes.forEach(p=>{ if(!p) throw new Error("There's an empty pipe. Remove the extra | or add a command after it."); res=applyCmd(res,p); });
  return res;
}
function summary(l){
  if(l.sourcetype==="email") return `${l.action}: ${l.sender} → ${l.recipient} “${l.subject}”`;
  if(l.sourcetype==="proxy") return `${l.process} → ${l.dest_host}:${l.dest_port}`;
  if(l.sourcetype==="firewall") return `${l.action.toUpperCase()} ${l.protocol} ${l.src_ip} → ${l.dest_ip}:${l.dest_port} out=${l.bytes_out}B in=${l.bytes_in}B${l.threat!=="none"?" ["+l.threat+"]":""}`;
  if(l.sourcetype==="wineventlog") return `4698 task created ${l.TaskName} → ${l.TaskAction}`;
  if(l.EventID===1) return `Process: ${l.ParentImage.split("\\").pop()} → ${l.Image.split("\\").pop()} | ${l.CommandLine}`;
  if(l.EventID===3) return `Network: ${l.Image} ${l.SourceIp} → ${l.DestinationIp}:${l.DestinationPort}`;
  if(l.EventID===11) return `File created: ${l.TargetFilename}`;
  if(l.EventID===22) return `DNS: ${l.QueryName} → ${l.QueryResults}`;
  return "";
}

    if(hit) res=`<div class="verdict ${hit.v==="malicious"?"bad":"good"}"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class="pill ${hit.v==="malicious"?"bad":"good"}">${hit.v.toUpperCase()}</span><span class="mono">${esc(intelInput.trim())}</span><span class="mono muted">${hit.score} engines flagged</span></div><p>${esc(hit.note)}</p><div>${hit.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join(" ")}</div></div>`;
    else res=`<div class="verdict unk"><span class="pill">NO DATA</span> <span class="mono">${esc(intelInput.trim())}</span><p class="muted">No reputation data. Unknown is not the same as safe; decide from context.</p></div>`;
  }
  return topbar()+`<div class="grid two">
   <div class="card"><h2>Reputation lookup</h2><form class="q" id="iform"><input id="iin" value="${esc(intelInput)}" placeholder="IP, domain or SHA-256" aria-label="Indicator"><button class="btn primary">Look up</button></form><div style="margin-top:12px">${res}</div>
   <p class="hint">Works like VirusTotal or AbuseIPDB in the real world. Indicators in alerts are clickable and land here.</p></div>
   <div class="card"><h2>Decoder</h2><p class="hint">Paste a Base64 blob (for example a PowerShell <code class="mono">-enc</code> argument). UTF-16LE is detected automatically, like CyberChef's “From Base64 → Decode text”.</p>
   <textarea id="decIn" aria-label="Base64 input" spellcheck="false"></textarea><div style="margin-top:8px"><button class="btn" id="decBtn">Decode</button></div><pre class="raw" id="decOut">Output appears here.</pre></div>
  </div>`;
}

function vPlaybooks(){
  return topbar()+`<div class="grid" style="max-width:860px">
  <details class="pb" open><summary>Phishing triage</summary><ol>
  <li>Check the sender domain carefully against the real one. Look for extra hyphens, swapped letters, added words.</li>
  <li>Read SPF / DKIM / DMARC. A fail is a strong signal; a pass only proves the domain sent it, not that the domain is trustworthy.</li>
  <li>Compare Reply-To with From. A mismatch to a free mail provider is a red flag.</li>
  <li>Look up the sender domain, sender IP, URLs and attachment hashes in Threat intel.</li>
  <li>Check delivery: delivered or quarantined? Then search SIEM for the recipient's host for file or process activity after delivery.</li>
  <li>Check Documentation for approved senders.</li>
  <li>Classify. Escalate a TP if it was delivered and could be acted on, or if there is evidence of interaction.</li></ol></details>
  <details class="pb"><summary>Process and execution triage</summary><ol>
  <li>Is the parent → child pair normal? (services.exe → svchost.exe is normal; winword.exe → powershell.exe is not.)</li>
  <li>Read the full command line. Flags like <code>-enc</code>, <code>-w hidden</code>, <code>-nop</code>, <code>IEX</code>, <code>DownloadString</code> deserve attention.</li>
  <li>Decode anything encoded.</li>
  <li>Check the file path (System32 vs. AppData/Temp/Downloads), signature and hash.</li>
  <li>Search SIEM for what happened 5 minutes before and after on that host.</li>
  <li>Check Documentation for approved admin activity.</li></ol></details>
  <details class="pb"><summary>Network triage</summary><ol>
  <li>Which process made the connection? Browsers talking to the web is normal; PowerShell or an unknown exe talking to a raw IP is not.</li>
  <li>Look up the destination IP / domain.</li>
  <li>Look for regular intervals (beaconing) and DNS lookups that led to the IP: <code>Image="x.exe" EventID=3 | table _time, DestinationIp</code>.</li>
  <li>Pivot to the firewall to confirm the traffic was allowed and how much left: <code>sourcetype="firewall" dest_ip="IP" | stats sum(bytes_out) by src_ip</code>.</li></ol></details>
  <details class="pb"><summary>Escalation criteria</summary><ol>
  <li>Escalate: confirmed malicious activity on a host, credentials possibly exposed, malicious mail delivered to a user, persistence, C2.</li>
  <li>Don't escalate: false positives, or true positives that a control fully stopped with no further impact (document and link to the parent case).</li></ol></details></div>`;
}

function vReports(){
  const closed=ALERTS.filter(a=>S.a[a.id]&&S.a[a.id].status==="closed");
  const sc=score();
  return topbar()+`<div class="card" style="margin-bottom:16px"><h2>Shift score ${sc.pts}/${sc.max||0}</h2><div class="bar"><i style="width:${sc.max?sc.pts/sc.max*100:0}%"></i></div><p class="hint">1 point for the right classification, 1 more for the right escalation decision.</p></div>
  ${closed.length?`<div class="grid">${closed.map(a=>reportCard(a)).join("")}</div>`:`<div class="card"><p class="muted">No case reports yet. Close an alert from the queue to see feedback here.</p></div>`}`;
}
function reportCard(a){
  const r=S.a[a.id].report; const cOk=r.cls===a.answer.cls, eOk=r.esc===a.answer.esc;
  const mentioned=a.keys.filter(k=>(r.notes+" "+r.iocs).toLowerCase().includes(k.toLowerCase()));
  return `<div class="card"><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between"><h3 style="margin:0">${a.id} · ${esc(a.title)}</h3><div style="display:flex;gap:6px;flex-wrap:wrap"><span class="pill ${cOk?"good":"bad"}">You: ${r.cls} ${cOk?"✓":"✗ (answer "+a.answer.cls+")"}</span><span class="pill ${eOk?"good":"bad"}">Escalate: ${r.esc?"yes":"no"} ${eOk?"✓":"✗"}</span></div></div>
  <p><b>Why:</b> ${esc(a.why)}</p>
  <p class="hint">Key evidence a reviewer looks for: ${a.keys.map(k=>`<span class="pill ${mentioned.includes(k)?"good":""}">${esc(k)}</span>`).join(" ")} ${mentioned.length?"(green = in your report)":""}</p>
  <details><summary class="hint" style="cursor:pointer">Your report</summary><pre class="raw">${esc(r.notes)}${r.iocs?"\n\nIOCs: "+esc(r.iocs):""}</pre></details></div>`;
}

function vGuide(){
  return topbar()+`<div class="card prose"><h2>How this works</h2>
  <p>This is a practice version of a Tier 1 SOC shift. Alerts arrive on a clock. Each one is either a <b>true positive</b> (real malicious activity) or a <b>false positive</b> (the rule fired but nothing bad happened). Your job is to decide which, decide whether it needs escalation to Tier 2 / incident response, and write a short case report that someone else could act on.</p>
  <h3>A good case report answers</h3><ul><li><b>Who</b>: user and host affected</li><li><b>What</b>: what happened, in plain words</li><li><b>When</b>: timestamps</li><li><b>Where</b>: hosts, IPs, domains</li><li><b>Why</b> you reached your verdict: the specific evidence</li><li><b>IOCs</b>: indicators to block or hunt for</li></ul>
  <h3>The loop for every alert</h3><ol><li>Read the alert fields.</li><li>Pivot into SIEM on the host, user, or indicator. Look at the minutes before and after.</li><li>Check indicators in Threat intel and decode anything encoded.</li><li>Check Documentation for what is normal here.</li><li>Decide, then write it down.</li></ol>
  <h3>Mapping to the real tools</h3><ul><li>SIEM here ≈ Splunk / Elastic / Microsoft Sentinel. The query syntax is a working subset of Splunk SPL, pipes included (<code>| stats</code>, <code>| timechart</code>, <code>| table</code>, <code>| sort</code>, <code>| head</code>, <code>| top</code>). The <a href="#" data-go="spl">SPL cookbook</a> walks through each query type.</li>
  <li>Sources: <code>email</code> (mail gateway), <code>sysmon</code> (endpoints), <code>wineventlog</code>, <code>proxy</code>, <code>firewall</code> (edge firewall with byte counts).</li><li>Sysmon EventIDs used: 1 process create, 3 network connection, 11 file create, 22 DNS query. Windows 4698 = scheduled task created.</li><li>Threat intel ≈ VirusTotal, AbuseIPDB, URLhaus. Decoder ≈ CyberChef.</li></ul>
  <h3>Tips</h3><ul><li>Pause the clock whenever you want. Speed it up once you're comfortable.</li><li>Not every alert on a compromised host is malicious.</li><li>“No data” in threat intel means unknown, not clean.</li></ul>
  <p class="hint">Scenario, company and people are fictional. IPs use reserved documentation ranges (198.51.100.0/24, 203.0.113.0/24). Progress saves in this browser.</p></div>`;
}

// ---------------- Drawer (alert detail + report form) ----------------
function drawer(){
  if(openId===null) return "";
  const a=ALERTS.find(x=>x.id===openId); const s=st(a.id);
  const isIOC=v=>INTEL[String(v).toLowerCase()];
  const fields=Object.entries(a.fields).map(([k,v])=>`<dt>${k}</dt><dd>${isIOC(v)||/^[0-9a-f]{64}$/.test(v)||/^\d+\.\d+\.\d+\.\d+$/.test(v)?`<button class="chip" data-ioc="${esc(v)}" title="Look up in Threat intel">${esc(v)}</button>`:esc(v)}</dd>`).join("");
  let body="";
  if(s.status==="closed"){ body=reportCard(a); }
  else if(drawerMode==="report"){
    body=`<form class="form" id="rform">
      <div><label class="t">Classification</label><div class="radios"><label><input type="radio" name="cls" value="TP" id="clsTP"><span>True positive</span></label><label><input type="radio" name="cls" value="FP" id="clsFP"><span>False positive</span></label></div></div>
      <div><label class="t">Escalate to Tier 2?</label><div class="radios"><label><input type="radio" name="esc" value="yes" id="escY"><span>Yes</span></label><label><input type="radio" name="esc" value="no" id="escN"><span>No</span></label></div></div>
      <div><label class="t" for="iocs">IOCs (comma separated)</label><input type="text" id="iocs" placeholder="e.g. 203.0.113.47, evil.example"></div>
      <div><label class="t" for="notes">Case report: who, what, when, where, why</label><textarea id="notes" placeholder="At 09:16 j.harmon on WKS-FIN-07 received…"></textarea></div>
      ${formErr?`<div class="err">${esc(formErr)}</div>`:""}
      <div style="display:flex;gap:8px"><button class="btn primary">Close alert</button><button type="button" class="btn" data-mode="detail">Back to details</button></div></form>`;
  } else {
    body=`<div style="display:flex;gap:8px;flex-wrap:wrap">${s.status==="owned"?`<button class="btn primary" data-mode="report">Write case report</button>`:`<button class="btn primary" id="takeBtn">Assign to me</button>`}
      ${a.hunt.map(q=>`<button class="btn" data-hunt='${esc(q)}'>SIEM: ${esc(q.length>34?q.slice(0,34)+"…":q)}</button>`).join("")}</div>`;
  }
  return `<div class="scrim" data-close="1"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Alert ${a.id}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start"><div><div class="mono muted">ALERT ${a.id} · ${fmt(a.at)} · ${a.type}</div><h2>${esc(a.title)}</h2><span class="sev ${a.sev}">${a.sev}</span></div><button class="btn sm" data-close="1">Close</button></div>
    <div class="card" style="background:var(--panel2)"><dl class="kv">${fields}</dl></div>${body}</aside>`;
}

// ---------------- Render + events ----------------
const VIEWS={dashboard:vDashboard,queue:vQueue,siem:vSiem,spl:vSpl,intel:vIntel,docs:vDocs,playbooks:vPlaybooks,reports:vReports,guide:vGuide};
function render(){
  document.querySelectorAll(".nav[data-v]").forEach(b=>b.setAttribute("aria-current", b.dataset.v===S.view));
  document.getElementById("main").innerHTML=VIEWS[S.view]();
  document.getElementById("overlay").innerHTML=drawer();
  updateCount();
}
function go(v){ S.view=v; save(); render(); document.getElementById("main").scrollTop=0; }

document.addEventListener("click",e=>{
  const t=e.target.closest("button,tr,a,div.scrim"); if(!t) return;
  const d=t.dataset;
  if(d.v){ go(d.v); return; }
  if(d.go){ e.preventDefault(); go(d.go); return; }
  if(t.id==="resetBtn"){ if(t.dataset.armed){ S=fresh(); save(); openId=null; toast("Scenario restarted"); render(); } else { t.dataset.armed=1; t.textContent="Click again to confirm"; setTimeout(()=>{t.textContent="Restart scenario"; delete t.dataset.armed;},3000);} return; }
  if(d.speed){ S.speed=+d.speed; save(); render(); return; }
  if(t.id==="pauseBtn"){ S.paused=!S.paused; save(); render(); return; }
  if(d.alert){ openId=+d.alert; drawerMode="detail"; formErr=""; S.seen[openId]=1; save(); render(); return; }
  if(d.close){ openId=null; render(); return; }
  if(t.id==="takeBtn"){ const s=st(openId); s.status="owned"; s.owned=S.t; save(); render(); return; }
  if(d.mode){ drawerMode=d.mode; formErr=""; render(); return; }
  if(d.hunt){ siemQuery=d.hunt; openId=null; go("siem"); return; }
  if(d.ioc){ intelInput=d.ioc; openId=null; go("intel"); return; }
  if(d.q){ siemQuery=d.q; render(); return; }
  if(d.add){ const parts=splitPipes(siemQuery); const h=parts[0].trim(); parts[0]=(!h||h==="*"?"":h+" ")+d.add; siemQuery=parts.join(" | "); render(); return; }
  if(d.drill){ const h=splitPipes(siemQuery)[0].trim(); siemQuery=(!h||h==="*"?"":h+" ")+d.drill; render(); return; }
  if(d.log!==undefined){ const r=document.getElementById("lx"+d.log); r.hidden=!r.hidden; return; }
  if(t.id==="decBtn"){ const out=b64decode(document.getElementById("decIn").value); document.getElementById("decOut").textContent= out===null?"That isn't valid Base64. Copy only the blob after -enc.":out; return; }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&openId!==null){openId=null;render();}
  if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.alert){openId=+e.target.dataset.alert;drawerMode="detail";render();}
});
document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="qform"){ siemQuery=document.getElementById("qin").value||"*"; render(); }
  if(e.target.id==="iform"){ intelInput=document.getElementById("iin").value; render(); }
  if(e.target.id==="rform"){
    const cls=(document.querySelector('input[name=cls]:checked')||{}).value;
    const escv=(document.querySelector('input[name=esc]:checked')||{}).value;
    const notes=document.getElementById("notes").value.trim(); const iocs=document.getElementById("iocs").value.trim();
    if(!cls||!escv){ formErr="Pick a classification and an escalation decision."; render(); keep(notes,iocs,cls,escv); return; }
    if(notes.length<40){ formErr="Write at least a couple of sentences: who, what, when, and why you decided."; render(); keep(notes,iocs,cls,escv); return; }
    const s=st(openId); s.status="closed"; s.closedAt=S.t; s.report={cls,esc:escv==="yes",notes,iocs};
    const a=ALERTS.find(x=>x.id===openId); save();
    toast(cls===a.answer.cls?"Closed. Classification correct.":"Closed. Check the feedback.");
    render();
  }
});
function keep(n,i,c,e){ document.getElementById("notes").value=n; document.getElementById("iocs").value=i; if(c)document.getElementById("cls"+c).checked=true; if(e)document.getElementById(e==="yes"?"escY":"escN").checked=true; }

render();
</script>
